services:
  #==================================
  # POSTGRESQL
  #==================================
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CampusCloudPostgres#
      POSTGRES_DB: campuscloud
    ports:
      - "54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campuscloud-nwt

  #==================================
  # PGADMIN
  #==================================
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@campuscloud.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campuscloud-nwt

#==================================
# VOLUMENES
#==================================
volumes:
  postgres_data:
    external: true
    name: postgres_volume
  pgadmin_data:
    external: true

#==================================
# RED
#==================================
networks:
  campuscloud-nwt:
    external: true