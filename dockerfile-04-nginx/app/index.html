<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil Moderno</title>
<style>
/* Variables de diseño */
:root {
--bg-color: #0f172a;
--card-bg: rgba(30, 41, 59, 0.7);
--accent-color: #38bdf8;
--text-main: #f8fafc;
--text-muted: #94a3b8;
}

/* Reset básico */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
background-color: var(--bg-color);
color: var(--text-main);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
background-image:
radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
}

/* Tarjeta Principal */
.card {
background: var(--card-bg);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 24px;
padding: 40px;
max-width: 450px;
width: 100%;
text-align: center;
box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
transition: transform 0.3s ease;
}

.card:hover {
transform: translateY(-5px);
}

/* Imagen de Perfil ficticia (puedes cambiar la URL) */
.profile-img {
width: 120px;
height: 120px;
border-radius: 50%;
object-fit: cover;
border: 3px solid var(--accent-color);
margin-bottom: 20px;
box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
}

h1 {
font-size: 1.8rem;
margin-bottom: 8px;
font-weight: 700;
letter-spacing: -0.5px;
}

.subtitle {
color: var(--accent-color);
font-size: 1rem;
font-weight: 500;
margin-bottom: 15px;
text-transform: uppercase;
letter-spacing: 1px;
}

.bio {
color: var(--text-muted);
font-size: 0.95rem;
line-height: 1.6;
margin-bottom: 30px;
}

/* Enlaces / Botones */
.links-container {
display: flex;
flex-direction: column;
gap: 12px;
}

.btn {
display: block;
background: rgba(255, 255, 255, 0.05);
color: var(--text-main);
text-decoration: none;
padding: 14px;
border-radius: 12px;
font-weight: 600;
font-size: 0.95rem;
border: 1px solid rgba(255, 255, 255, 0.05);
transition: all 0.2s ease;
}

.btn:hover {
background: var(--accent-color);
color: #000;
border-color: var(--accent-color);
box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
}
</style>
</head>
<body>

<div class="card">
<!-- Imagen de marcador de posición elegante -->
<img src="https://unsplash.com&quot; alt="Foto de perfil" class="profile-img">

<h1>Álex Pérez</h1>
<div class="subtitle">Desarrollador Full Stack</div>

<p class="bio">
Apasionado por crear experiencias web hermosas, eficientes y optimizadas. Especializado en Docker, Node.js y arquitectura en la nube.
</p>

<div class="links-container">
<a href="#" class="btn">Ver Mi Portafolio</a>
<a href="#" class="btn">Mi GitHub</a>
<a href="#" class="btn">Contáctame por LinkedIn</a>
</div>
</div>

</body>
</html>
